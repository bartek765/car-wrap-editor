    <rect x="20" y="20" width="25" height="25"/>
    <rect x="70" y="20" width="25" height="25"/>
    <rect x="120" y="20" width="25" height="25"/>
    <rect x="45" y="45" width="25" height="25"/>
    <rect x="95" y="45" width="25" height="25"/>
    <rect x="145" y="45" width="25" height="25"/>
    <rect x="20" y="70" width="25" height="25"/>
    <rect x="70" y="70" width="25" height="25"/>
    <rect x="120" y="70" width="25" height="25"/>
    <rect x="45" y="95" width="25" height="25"/>
    <rect x="95" y="95" width="25" height="25"/>
    <rect x="145" y="95" width="25" height="25"/>
    <rect x="20" y="120" width="25" height="25"/>
